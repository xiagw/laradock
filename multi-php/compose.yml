          - LARADOCK_PHP_VERSION=8.0

    # PHP 8.0 CLI (composer / artisan / tinker):
    #   docker compose ... exec workspace-80 bash
    workspace-80:
      extends:
        file: ../workspace/compose.yml
        service: workspace
      build:
