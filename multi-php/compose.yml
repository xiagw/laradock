    workspace-73:
      extends:
        file: ../workspace/compose.yml
        service: workspace
      build:
        context: ../workspace
        args:
          - LARADOCK_PHP_VERSION=7.3

    # PHP 7.4 web (FPM). Route a site to it with: fastcgi_pass php-fpm-74:9000;
    php-fpm-74:
      extends:
        file: ../php-fpm/compose.yml
        service: php-fpm
      build:
        context: ../php-fpm
        args:
          - LARADOCK_PHP_VERSION=7.4

    # PHP 7.4 CLI (composer / artisan / tinker):
