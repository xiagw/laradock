services:

    zentao:
      image: easysoft/zentao:${ZENTAO_VERSION}
      restart: always
      ports:
        - "${ZENTAO_PORT}:80"
      environment:
        # - MYSQL_INTERNAL=${ZENTAO_MYSQL_INTERNAL}
        - ZT_MYSQL_HOST=${ZENTAO_MYSQL_HOST}
        - ZT_MYSQL_PORT=${ZENTAO_MYSQL_PORT}
        - ZT_MYSQL_USER=${ZENTAO_MYSQL_USER}
        - ZT_MYSQL_PASSWORD=${ZENTAO_MYSQL_PASSWORD}
        - ZT_MYSQL_DB=${ZENTAO_MYSQL_DB}
        # - REDIS_INTERNAL=${ZENTAO_REDIS_INTERNAL}
        - ZT_REDIS_HOST=${ZENTAO_REDIS_HOST}
        - ZT_REDIS_PORT=${ZENTAO_REDIS_PORT}
        - ZT_REDIS_PASSWORD=${ZENTAO_REDIS_PASSWORD}
        - ZT_REDIS_SERIALIZER=igbinary
        - ZT_REDIS_DATABASE=0
        - ZT_CACHE_ENABLE=true
        - ZT_CACHE_TYPE=redis
        - ZT_CACHE_SCOPE=private
        - ZT_CACHE_LIFETIME=0
        - PHP_SESSION_TYPE=${ZENTAO_PHP_SESSION_TYPE}
        # - PHP_SESSION_PATH=${ZENTAO_PHP_SESSION_PATH}
        # - PHP_SESSION_REDIS_DATABASE={ZENTAO_PHP_SESSION_REDIS_DATABASE}
        - PHP_MAX_EXECUTION_TIME=${ZENTAO_PHP_MAX_EXECUTION_TIME}
        - PHP_MEMORY_LIMIT=${ZENTAO_PHP_MEMORY_LIMIT}
        - PHP_POST_MAX_SIZE=${ZENTAO_PHP_POST_MAX_SIZE}
        - PHP_UPLOAD_MAX_FILESIZE=${ZENTAO_PHP_UPLOAD_MAX_FILESIZE}
        - SMTP_ENABLED=${ZENTAO_SMTP_ENABLED}
        - SMTP_FROMNAME=${ZENTAO_SMTP_FROMNAME}
        - SMTP_HOST=${ZENTAO_SMTP_HOST}
        - SMTP_PORT=${ZENTAO_SMTP_PORT}
        - SMTP_USER=${ZENTAO_SMTP_USER}
      networks:
        - frontend
        - backend
      volumes:
        - ${DATA_PATH_HOST}/zentao:/data
